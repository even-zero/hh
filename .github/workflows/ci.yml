name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: tests (py${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "${{ matrix.python }}"

      # The core is stdlib-only by design: installing nothing here means an
      # accidental third-party import fails the build immediately.
      - name: Test suite (stdlib only, no install)
        run: python -m unittest discover -s tests -v

      - name: Recorded-parser conformance (13 runner fixtures)
        run: python experiments/conformance.py

      - name: CLI smoke — plan, run, receipt
        run: |
          python -m hh --version
          python -m hh tool-spec > /tmp/tool.json
          python -c "import json;assert json.load(open('/tmp/tool.json'))['name']=='run_tests'"
          python -m hh --store-root /tmp/h8 plan --root fixtures/synth_tiny_7 --out /tmp/plan.json
          python -m hh --store-root /tmp/h8 run --plan /tmp/plan.json --root fixtures/synth_tiny_7 --suite-id ci
          python -m hh --store-root /tmp/h8 savings --json

  package:
    name: build + install from wheel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade build
      - name: Build sdist + wheel
        run: python -m build
      - name: Install the wheel into a clean venv and smoke it
        run: |
          python -m venv /tmp/venv
          /tmp/venv/bin/pip install --quiet dist/*.whl
          /tmp/venv/bin/hh --version
          /tmp/venv/bin/hh tool-spec > /tmp/tool.json
          /tmp/venv/bin/hh --store-root /tmp/h8w plan \
            --root "$GITHUB_WORKSPACE/fixtures/synth_tiny_7" --out /tmp/plan.json
          cd /tmp && /tmp/venv/bin/hh --store-root /tmp/h8w run \
            --plan /tmp/plan.json --root "$GITHUB_WORKSPACE/fixtures/synth_tiny_7" --suite-id wheel
      - name: Verify installed package is importable from a different cwd
        run: cd /tmp && /tmp/venv/bin/python -c "import hh, hh.tool, hh.savings; print(hh.__version__)"
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/*

  live-adapters:
    name: live adapters (jest, mocha, node:test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Live JS conformance (installs jest+mocha into a scratch dir)
        run: python experiments/conformance.py --live-js
